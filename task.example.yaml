# One task file per run. Every key here can also be given on the command line;
# the command line wins. Field names follow the reference client's pages.
#
#   cp config.example.yaml config.yaml          <- do this first
#   ogtool --config config.yaml <feature> --task task.example.yaml
#
# --config is a global option and goes BEFORE the feature name; --task belongs
# to the feature. Every feature defaults to --dry-run.

task_name: demo
accounts: []                  # labels from `ogtool accounts list`; [] = the pool

# Answers handed to the dry-run sender, in order, one per request. When the
# list runs out every request answers "ok". This is what makes the retry, the
# PEER_FLOOD backoff and the MISSING/FLOOD exports visible offline.
# Kept short on purpose: one PEER_FLOOD and one refusal show the retry and the
# exports without a long wait in the demo.
simulate_responses:
  - ok
  - PEER_FLOOD
  - ok
  - USER_PRIVACY_RESTRICTED
  - CHANNEL_PRIVATE
  - USER_ALREADY_PARTICIPANT

# #5 群发消息 -------------------------------------------------------------
targets:
  kind: custom                # private | group | channel | client | custom
  inline: "@demo_chat,+8613800000000,t.me/demo_public"
  files: []                   # files with one entry per line

content:
  text: "hello from ogtool"
  media: ""                   # path to a file, optional
  forward_from: ""            # a chat to forward from, optional
  prompt: ""                  # used when ai: true
  ai: false

send:
  account_interval_min: 5     # 单账号发送间隔 最小（秒）
  account_interval_max: 12    # 单账号发送间隔 最大（秒）
  group_interval: 3           # 单群间隔（秒）
  threads: 1                  # 发送线程
  daily_limit: 50             # 单号每日限制
  success_cap: 0              # 成功上限, 0 = unlimited
  exec_cap: 0                 # 执行上限, 0 = unlimited

# #6 自动回复 -------------------------------------------------------------
auto_reply:
  enabled: true
  duplicate_seconds: 60       # 重复缓存(秒)
  rules:
    - keyword: "天气"
      reply: "是啊，天气晴朗，万里无云"
    - keywords: ["价格", "多少钱"]
      reply: "价目表稍后私聊发你"

simulate:
  - "@demo_chat|alice|今天天气不错"
  - "@demo_chat|alice|今天天气不错"
  - "@demo_chat|bob|多少钱"
  - "@demo_chat|carol|毫无关系的闲聊"

# #7 监听聊天 -------------------------------------------------------------
watch_chat:
  inline: "@demo_watch"        # 自定义目标
  exclude: "spam,广告"         # 排除关键词（逗号或换行）
  relay: "@demo_relay"         # 中转群链接
  messages:                    # replayed in a dry run
    - "@demo_watch|alice|hello there"
    - "@demo_watch|bob|cheap 广告 here"

# #8 批量加群 -------------------------------------------------------------
batch_join:
  inline: "@group_one,@group_two"   # 群链接清单
  request_interval: 5          # 请求间隔
  request_timeout: 30          # 请求超时
  account_interval: 10         # 单号加群间隔
  per_account_cap: 0           # 单号最大加群量, 0 = unlimited
  threads: 1                   # 并发数
  success_cap: 0
  exec_cap: 0
  flood_cap: 1

# #9 批量上号 -------------------------------------------------------------
batch_login:
  import_folder: ""            # 导入文件夹
  import_zip: ""               # 导入ZIP（*.session + *.json 元数据）
  export_ids: ""               # 导出所有ID
  logout: ""                   # frozen | all | both, empty = no logout
  label_prefix: ""

# #10 批量改名 ------------------------------------------------------------
batch_rename:
  file: ""                     # .txt: 每行「名字 姓氏」或单独一个名称
  operation_interval: 10       # 操作间隔
  success_cap: 0
  flood_cap: 2
  pause_at: 0                  # dry-run demo: pause once after this entry
  stop_at: 0                   # dry-run demo: stop once before this entry

# #11 批量拉人 ------------------------------------------------------------
batch_invite:
  groups: ["@target_group"]    # 群组
  members_file: ""             # 成员（文件或 members: [...]）
  members: []
  strategy: continue           # continue | loop（邀请策略）
  request_interval: 10         # 最小请求间隔
  threads: 1                   # 并发账号数
  target_success_cap: 0        # 目标群邀请成功上限
  handler_success_cap: 0       # 拉手号限制 成功
  handler_exec_cap: 0          # 拉手号限制 执行数
  invite_interval: 10          # 最小邀请间隔
  admin_account: ""            # 管理员账号
  member_flood_cap: 2          # PEER_FLOOD邀请对象重试上限
  handler_flood_cap: 3         # PEER_FLOOD拉手最大次数
  add_contact_wait: 5          # 添加联系人等待
  export_missing: ""           # 导出MISSING
  export_flood: ""             # 导出FLOOD
  report: false                # 生成报表

# #12 筛选手机 ------------------------------------------------------------
filter_phone:
  numbers: ""                  # 号码清单, comma separated
  file: ""                     # 号码清单, one per line
  threads: 1                   # 并发账号数量
  output: ""                   # 输出文件
  flood_cap: 2

# #13 筛选群组 ------------------------------------------------------------
filter_group:
  inline: "@group_one,@group_two"   # 群组清单
  threads: 1                   # 并发账号数量
  global_interval_ms: 500      # 全局请求间隔（毫秒）
  account_interval_ms: 800     # 单账号请求间隔（毫秒）
  deep: false                  # 深度检测
  output_dir: ""               # 输出目录

# #14 视频管理 ------------------------------------------------------------
video_manage:
  link: "@video_group"         # 群链接
  interval_ms: 1000            # 操作间隔（毫秒）
  action: join                 # join | leave | stop

# #15 代理配置 ------------------------------------------------------------
proxy:
  add: []                      # ["socks5://host:port", ...]
  import_file: ""              # 导入
  paste: ""                    # 粘贴批量
  delete: 0
  clear: false
  test: false                  # 测速
  timeout_ms: 3000
  bind: []                     # ["account=proxy_id"]

# #16 批量联系人 ----------------------------------------------------------
add_contact:
  contacts: "@contact_one"     # 联系人列表
  success_cap: 0               # 成功上限
  exec_cap: 0                  # 执行上限
  per_target_cap: 1            # 每个目标成功次数
  request_interval_ms: 1000    # 请求间隔(ms)
  operation_interval_min_ms: 500    # 操作间隔 min (ms)
  operation_interval_max_ms: 1500   # 操作间隔 max (ms)
  threads: 1                   # 线程数
  flood_cap: 2

# #17 批量拉人v2 ----------------------------------------------------------
batch_invite_v2:
  inline: "@my_group"          # 目标（自己名下的群/频道）
  contacts: "@contact_one"     # 自己的联系人
  request_interval: 8          # 最小请求间隔
  threads: 1                   # 线程数
  target_success_cap: 0        # 目标群邀请成功上限
  success_cap: 0               # 成功上限
  exec_cap: 0                  # 执行上限
  invite_interval_min: 8       # 邀请间隔 最小
  invite_interval_max: 15      # 邀请间隔 最大
  flood_cap: 3                 # 允许PEER_FLOOD最大次数
  invitee_flood_cap: 2         # 邀请对象PEER_FLOOD最大次数
  export_flood_timeout: ""     # 导出PEER_FLOOD和TIMEOUT记录

# #21 保持在线 ------------------------------------------------------------
keep_online:
  interval: 300               # seconds between heartbeats
  loops: 3                    # 0 = until interrupted
  jitter: 0.1

# #0 话术炒群 -------------------------------------------------------------
puppet_chat:
  inline: "@demo_chat"         # 自定义目标（每行一个）
  pattern: patterns/example.txt     # 话术文件, a chat_pattern .txt
  mode_file: ""                # 未选择模式文件, optional: name=path lines
  mode: ""                     # which entry of the mode file to play
  loop_interval: 5             # 循环间隔(分钟)
  loops: 1                     # 循环次数
  multiplier: 1                # 消息倍率
  daily_limit: 0               # 单号每日发言上限, 0 = unlimited
  polish: 0                    # 润色程度 0-3
  ai_polish: false             # AI实时润色

# #1 复制炒群 -------------------------------------------------------------
copy_chat:
  inline: "@demo_target"       # 自定义目标（每个目标群一行）
  sources: "@demo_source"      # 来源群组, at most 1000
  copy_mode: copy              # copy | rewrite | ai
  capture_minutes: 60          # 采集回溯时长（分钟）
  daily_limit: 0               # 单号每日发言上限
  multiplier: 1                # 消息倍率
  polish: 0                    # 润色程度
  interval_min: 5              # 最小发言间隔（秒）
  interval_max: 12             # 最大发言间隔（秒）
  # 过滤关键词: | 分隔同组备选，空行分组（第1组→目标1，最后一组→其余目标）
  filter_keywords: |
    spam|广告
    cheap

  filter_senders: ""           # 过滤发送者ID, comma separated
  replacements: |              # 关键词替换, left=right
    demo=Demo
  account_groups: ""           # 执行账号分组, one line per target
  messages:                    # captured history, replayed in a dry run
    - "@demo_source|alice|the demo starts today"
    - "@demo_source|bob|cheap spam inside"

# #2 AI原创炒群 -----------------------------------------------------------
ai_chat:
  inline: "@demo_chat"         # 自定义目标
  interval_min: 20             # 发言间隔（秒）最小
  interval_max: 60             # 发言间隔（秒）最大
  news_channel: ""             # 外部新闻频道
  insert_probability: 0        # 插入概率（%）
  topics: |                    # 群聊话题提示词, blank line separated
    周末去哪玩

    最近在追的剧
  news: []                     # news items the dry run may pull in
  count: 2                     # messages per target

# #3 AI智能评论 -----------------------------------------------------------
ai_comment:
  inline: "@demo_channel"      # 目标频道/帖子
  comment_interval_min: 15     # 评论间隔最小（秒）
  comment_interval_max: 45     # 评论间隔最大（秒）
  per_post_min: 1              # 每帖评论数（最小）
  per_post_max: 2              # 每帖评论数（最大）
  positive_ratio: 60           # 积极乐观比例（%）
  likes_min: 0                 # 每帖点赞数（最小）
  likes_max: 3                 # 每帖点赞数（最大）
  emoji_probability: 30        # 表情包概率（%）
  like_emoji: ""               # 点赞表情
  max_chars: 80                # 评论最大字数
  poll_interval: 60            # 轮询间隔（秒）
  poll_recent: 3               # 轮询检查最近帖子数
  extra_prompts: |             # 额外提示词, blank line separated
    不要提价格
  posts: 2                     # simulated posts per target
  seed: 7                      # reproducible plan

# #4 AI搬运频道 -----------------------------------------------------------
ai_clone:
  sources: "@demo_source_channel"   # 源频道/帖子
  inline: "@demo_target_channel"    # 目标频道
  mode: copy                   # copy | rewrite | ai
  mapping: |                   # 源/目标映射, source=target
    @demo_source_channel=@demo_target_channel
  max_items: 10                # 最多
  poll_interval: 60            # 轮询间隔（秒）
  post_interval_min: 10        # 发贴间隔最小值（秒）
  post_interval_max: 30        # 发贴间隔最大值（秒）
  author: ""                   # 作者信息（可多行）
  style: ""                    # AI行文风格
  filter_keywords: ""          # 过滤关键词（包含则跳过）
  replacements: ""             # 关键词替换, old=new
  messages:
    - "@demo_source_channel|channel|launch day is here"
    - "@demo_source_channel|channel|promo spam post"

# #19 话术炒群v2 ----------------------------------------------------------
puppet_chat_v2:
  inline: "@my_own_group"      # 目标（自己名下的群/频道）
  pattern: patterns/example.txt
  mode_file: ""
  mode: ""
  startup_interval: 10         # 不同号启动间隔（秒）
  loop_interval: 5             # 循环间隔(分钟)
  loops: 1                     # 循环次数
  multiplier: 1                # 消息倍率
  daily_limit: 0               # 单号每日发言上限

# #18 群发私信v2 ----------------------------------------------------------
mass_send_v2:
  text: "hello, this is the v2 demo"   # 消息内容
  media: ""                            # 消息媒体
  account_interval_min: 5              # 单账号发送间隔最小值（秒）
  account_interval_max: 12             # 单账号发送间隔最大值（秒）
  group_interval: 3                    # 单群间隔
  threads: 1                           # 发送线程
  daily_limit: 20                      # 单号每日限制
  success_cap: 0                       # 成功上限
  exec_cap: 0                          # 执行上限
  allow_duplicates: false              # 一个联系人只发一次
  resume: true                         # 发过的跳过，重跑可续
  # A dry run cannot read the contact book, so it is spelled out here.
  contacts:
    demo1: ["Ann|@ann_demo", "Bob|@bob_demo"]
    demo2: ["Ann|@ann_demo", "Cid|@cid_demo"]

# #20 自动营销 ------------------------------------------------------------
mix_market:
  group_title:                 # 第 2 步要建的自建群/频道
    - "Market Group A"
    - "Market Group B"
  targets: ""                  # 已有群（可不填）
  pattern: patterns/example.txt
  text: "hello from the workflow"
  media: ""
  contact:                     # 第 1 步添加、第 4/5 步使用的联系人
    - "Ann|@ann_demo"
    - "Bob|@bob_demo"
  dead_check_interval: 30      # 死群检测间隔（秒）
  dead_after_hours: 72         # 多久没说话算死群
  activity:                    # 死群检测的模拟数据, ref=hours
    - "@og_market_group_b=96"
  create_rest_min: 1           # 建群失败休息（分钟）到
  create_rest_max: 5
  stop_after: 5                # 只跑前 N 步，方便单段验证

# #23 自动脚本 ------------------------------------------------------------
auto_script:
  script_name: warm_up         # scripts/*.yaml 里的 name
  script_dir: ""               # 空 = <data_dir>/scripts 或仓库自带 scripts/
  target: "@demo_chat"
  var:
    - greeting=hello everyone
  on_error: ""                 # 空 = 用脚本里每步自己的 stop/continue

# #22 高级功能 ------------------------------------------------------------
export_accounts:
  output_dir: ""               # 空 = <logs>/exports
  formats: csv,json
  no_sessions: false           # true 时不复制 .session
  profile:                     # dry-run 用的模拟资料
    - "demo1|700000001|demoone|iPhone 15|on"
