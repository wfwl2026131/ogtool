# Global settings for every ogtool feature.
#
# Copy to config.yaml and fill in what you have. Everything below works with
# placeholder values while features run with --dry-run; api_id / api_hash are
# only read by --live.

api_id: ${OGTOOL_API_ID:0}
api_hash: ${OGTOOL_API_HASH:}

# Paths are relative to this file.
data_dir: data
session_dir: data/sessions
db: data/og.sqlite
logs: data/logs

# Optional, used by --live only. Leave host empty to go direct.
proxy:
  kind: socks5          # socks5 | socks4
  host: ""
  port: 1080
  username: ""
  password: ${OGTOOL_PROXY_PASSWORD:}

# OpenAI compatible chat/completions endpoint. With no key the AI parts fall
# back to template wording and the flow still runs end to end.
ai:
  base_url: ""          # https://api.openai.com/v1
  api_key: ${OGTOOL_AI_KEY:}
  model: ""             # gpt-4o-mini
  timeout: 60

# Global knobs of the settings page (#24). The licence keys are deliberately
# not here: a run never needs a subscription, and nothing below restarts the
# process, it only says when a restart would be due.
globals:
  account_batch: 20          # 账号分批加载数量: rows pulled from the pool at a time
  threads_max: 128           # 全局线程池最大线程数: a task may ask for fewer
  resume_delay: 0            # 恢复任务延迟, seconds before a resumed task starts
  tp_overload: 0             # TP超载值, 0 turns the check off
  restart_interval: 0        # 重启间隔, seconds of uptime, 0 = no restart due
  restart_timed: false       # 定时重启, config only
