name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          # telethon is the live extra, but the unit suite imports it too: the
          # spec-client fixture builds MagicMock(spec=TelegramClient), and the
          # client-surface test introspects the real class. Skipping it would
          # mean the suite verifies a client that does not exist.
          pip install -e ".[dev]" "telethon>=1.36"
      - name: ruff
        run: ruff check .
      - name: pytest (offline unit suite)
        run: python -m pytest -o addopts="" -q
