name: release

# A tag is the release button: push v* and the wheel lands on the release
# page. The sdist rides along so installs-from-source have a pinned artifact.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: version agrees with the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          WHEEL_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$WHEEL_VERSION" ]; then
            echo "tag v$TAG but pyproject says $WHEEL_VERSION - bump the version first"
            exit 1
          fi
      - name: upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "ogtool $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" --clobber
